<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ZJCSAutoScript</title>
<script>
// 页面画出来之前先定好深浅色，免得闪一下。选择记在 localStorage，设置页的「外观」和顶栏的按钮会改它
(function () {
  var mode = 'auto';
  try { mode = localStorage.getItem('zjcs.gui.theme') || 'auto'; } catch (e) {}
  var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>

<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app" aria-busy="true"><div class="boot"><span class="spinner" aria-hidden="true"></span>正在读取配置…</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
