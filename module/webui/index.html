<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>一条龙 · 配置</title>
<script>
// 页面画出来之前先定好深浅色，免得闪一下。选择记在 localStorage，app.js 里的切换按钮会改它
(function () {
  var mode = 'auto';
  try { mode = localStorage.getItem('zjcs.gui.theme') || 'auto'; } catch (e) {}
  var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>

</head>
<body>
<div id="app" aria-busy="true"><div class="boot"><span class="spinner" aria-hidden="true"></span>正在读取配置…</div></div>

<script src="/app.js"></script>
</body>
</html>
