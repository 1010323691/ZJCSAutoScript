<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ZJCSAutoScript</title>
<style>
  /* 桌面壳的启动页：配置服务起来之前显示，配色和配置界面一致（参照 300HeroAutoScript：浅灰画布 + 白色面板 + 蓝色主色），深浅色跟随系统。
     Windows 无系统标题栏、Mac 标题栏叠在内容上，所以顶上自带一条可拖动的栏 */
  :root {
    --canvas: #eceef2; --surface: #ffffff; --surface-2: #f7f8fa; --border: #e3e6eb; --border-2: #eef0f3;
    --text: #15171c; --text-2: #4a505c; --text-3: #838996; --primary: #3461ff; --primary-soft: #e4e9ff;
    --danger: #e5484d; --hover: rgba(255, 255, 255, .75);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #0f1115; --surface: #171a21; --surface-2: #1c2028; --border: #2a2f3a; --border-2: #222731;
      --text: #e8eaef; --text-2: #b3b9c5; --text-3: #8a91a0; --primary: #5b7fff; --primary-soft: #26304f;
      --danger: #ff6369; --hover: rgba(255, 255, 255, .08);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: var(--canvas); color: var(--text);
    font: 13px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  .bar { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 18px; font-size: 14px; font-weight: 700; }
  .mac .bar { padding-left: 84px; }
  .bar svg { width: 24px; height: 24px; flex: none; }
  .bar .grow { flex: 1; }
  .bar button { display: none; width: 40px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--text-2); cursor: pointer; place-items: center; }
  .frameless .bar button { display: grid; }
  .bar button:hover { background: var(--hover); color: var(--text); }
  .bar button.x:hover { background: var(--danger); color: #fff; }
  .bar button svg { width: 15px; height: 15px; }
  .box {
    margin: auto auto calc(50vh - 120px); width: min(640px, calc(100% - 48px)); padding: 32px 36px; text-align: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 2px rgba(16, 24, 40, .05);
  }
  .spin { width: 40px; height: 40px; margin: 0 auto 18px; border-radius: 50%; border: 4px solid var(--primary-soft); border-top-color: var(--primary); animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  h2 { margin: 0 0 6px; font-size: 17px; }
  .stage { margin: 0; color: var(--text-2); }
  .error { display: none; flex-direction: column; gap: 12px; text-align: left; }
  .error h2 { color: var(--danger); text-align: center; }
  .error pre {
    margin: 0; max-height: 46vh; overflow: auto; padding: 12px 14px; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--border-2); color: var(--text-2);
    font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, "Microsoft YaHei UI", monospace;
    white-space: pre-wrap; word-break: break-all; user-select: text;
  }
  .error p { margin: 0; font-size: 12.5px; color: var(--text-3); text-align: center; }
  body.failed .loading { display: none; }
  body.failed .error { display: flex; }
</style>
</head>
<body>
<div class="bar" data-drag>
  <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#3461ff"/><g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><circle cx="12" cy="11.5" r="3"/><circle cx="28" cy="28.5" r="3"/><path d="M15.5 11.5h8a5 5 0 0 1 0 10h-7a5 5 0 0 0 0 10h8"/></g></svg>
  ZJCSAutoScript
  <span class="grow"></span>
  <button type="button" data-win="min" title="最小化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button type="button" data-win="close" class="x" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<main class="box">
  <div class="loading" role="status">
    <div class="spin" aria-hidden="true"></div>
    <h2>正在启动…</h2>
    <p class="stage" id="stage">首次启动可能需要十几秒。</p>
  </div>
  <section class="error" role="alert">
    <h2 id="error-title"></h2>
    <pre id="error-detail"></pre>
    <p>处理好之后，关掉这个窗口重新打开桌面壳（Windows 是 zjcs.exe，Mac 是 zjcs.command）。</p>
  </section>
</main>
<script>
  // 桌面壳（main.rs）通过 eval 调用这两个方法报告启动进度
  window.zjcsStartup = {
    stage(text) { document.getElementById('stage').textContent = text; },
    error(title, detail) {
      document.getElementById('error-title').textContent = title;
      document.getElementById('error-detail').textContent = detail;
      document.body.classList.add('failed');
    },
  };
  // 窗口按钮和拖动：走 main.rs 的 window_action 命令
  (function () {
    var T = window.__TAURI_INTERNALS__;
    if (!T || !T.invoke) return;
    var win = function (action) { return T.invoke('window_action', { action: action }).catch(function () {}); };
    var mac = false, dblAt = null;
    T.invoke('desktop_info').then(function (info) {
      mac = info.platform === 'macos';
      document.body.classList.toggle('mac', mac);
      document.body.classList.toggle('frameless', !!info.frameless);
    }).catch(function () {});
    document.querySelectorAll('[data-win]').forEach(function (b) { b.onclick = function () { win(b.dataset.win); }; });
    var bar = document.querySelector('[data-drag]');
    // 和 Tauri 自带的拖动区（drag.js）一样：按下时 preventDefault 再开始拖（不然 WebKit 自己选字，窗口拖不动）；
    // 双击最大化/还原，Mac 上在第二次松开、鼠标没动时才做
    bar.addEventListener('mousedown', function (e) {
      if (e.button !== 0 || (e.detail !== 1 && e.detail !== 2) || e.target.closest('button')) return;
      if (mac && e.detail === 2) { dblAt = [e.clientX, e.clientY]; return; }
      e.preventDefault();
      win(e.detail === 2 ? 'max' : 'drag');
    });
    bar.addEventListener('mouseup', function (e) {
      if (!dblAt || e.button !== 0) return;
      var p = dblAt; dblAt = null;
      if (e.detail === 2 && e.clientX === p[0] && e.clientY === p[1] && !e.target.closest('button')) win('max');
    });
  })();
</script>
</body>
</html>
