# 家园商店（广场商人推车）
MERCHANT_BOARD:         # 商人推车前面带「1」字的招牌（夜晚），点招牌正上方的车身进商店。左边约 150 像素是扭蛋机，绝对不能点
  screen: hscan_4
  area: [225, 838, 385, 890]
  button: [280, 760, 360, 815]
MERCHANT_BOARD_DAY:     # 同一块招牌（白天，场景有昼夜循环）。只取中间「1」到右边丝带，左半常被路过的角色挡住；点击位置同样是招牌上方的车身
  screen: home_day_cart
  area: [385, 845, 495, 880]
  button: [395, 765, 475, 815]
TEAM_INVITE:            # 家园底部弹出的「挑战赛组队邀请」（拒绝 / 查看），会挡住推车招牌。只等它消失，不点
  screen: home_team_invite
  area: [95, 912, 235, 938]

PAGE_SHOP:              # 标题「商店」
  screen: shop_general
  area: [41, 37, 101, 65]
SHOP_TAB_GENERAL:       # 底部页签「杂货」。有没有「特卖」页签（3 个或 4 个页签）都落在杂货上
  click: [190, 1195, 290, 1245]
GENERAL_TAB_ON:         # 「杂货」页签选中（黄底黑字），在整条页签栏里找。没认出选中就不能点一键购买（同一位置在宝库页是商品）
  screen: shop_general
  area: [222, 1205, 271, 1230]
VAULT_TAB_OFF:          # 没选中的「宝库」页签文字（白字黑底）。页签会因为「特卖」时有时无变成 3 个或 4 个、位置跟着变，
  screen: shop_general  # 所以在整条页签栏里按文字找（11-01 多出「特卖」后宝库从 x≈429 挪到 x≈360）
  area: [404, 1205, 452, 1230]
VAULT_TAB_ON:           # 「宝库」页签选中（黄底黑字），同样在整条页签栏里找。点商品后不在宝库页说明弹了别的东西（例如钻石不足），立刻停
  screen: vault_list
  area: [395, 1205, 465, 1238]
VAULT_SOLD:             # 商品格子中间的「售罄」章（第 1 件的位置，其他格子按间距平移）
  screen: vault_two_sold
  area: [100, 280, 165, 315]

# 杂货
SHOP_REFRESH:           # 右上「刷新」按钮
  click: [520, 100, 690, 140]
REFRESH_COUNT:          # 刷新按钮左边圆圈里的剩余次数（只用来判断刷新前后有没有变化）
  screen: shop_refresh1
  area: [455, 100, 487, 136]
REFRESH_COIN:           # 刷新价格前面的罗拉图标；不是罗拉就不刷新，避免花钻石
  screen: shop_refresh1
  area: [580, 103, 610, 133]
SHOP_ONEKEY:            # 底部「一键购买」
  screen: shop_general
  area: [212, 1086, 300, 1121]
  button: [220, 1080, 500, 1130]
ONEKEY_ZERO:            # 「一键购买 0」：没有符合折扣的商品
  screen: shop_onekey
  area: [378, 1088, 440, 1122]
SHOP_GEAR:              # 一键购买右边的齿轮
  click: [540, 1083, 582, 1125]

