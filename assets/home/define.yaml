# 家园场景是横向长卷：飞艇（最左）→ NPC → 小推车 → 糖果树 → 广场 → 小屋（最右）
# 场景物件的位置随滑动变化，下面的 area 只是截图时的位置，代码里会在大范围内搜索。

CART_BUBBLE:            # 小推车头顶的奖杯气泡（有挂机产出时出现）
  screen: home_s1
  area: [538, 748, 598, 800]

# 糖果树上的棒棒糖：漩涡颜色会循环变化，取 3 帧做模板。点一下收获；没有糖果时点树会进幻兽结缘卡池
# 只截圆盘里的漩涡、不带背景：糖果长在树身上（粉色）还是树边（夜空）位置不固定，带背景的模板在树身上只有 0.44（10-30 实测漏点）
CANDY_1:
  screen: candy_f0
  area: [128, 510, 162, 544]
CANDY_2:
  screen: candy_f1
  area: [128, 510, 162, 544]
CANDY_3:
  screen: candy_f2
  area: [128, 510, 162, 544]
CANDY_4:                # 黄昏光照、长在树身上
  screen: candy_dusk
  area: [248, 645, 282, 679]

# 小屋（家园最右端）：床、信箱。场景划到最右端后位置固定
BED:                    # 二楼左边的床，点开「床」弹窗
  click: [140, 595, 185, 630]
BED_DIALOG:             # 「床」弹窗标题
  screen: bed_dialog_free
  area: [58, 458, 102, 495]
BED_FREE_SPEEDUP:       # 「今日免费加速」（每天 1 次）；用过后变成「全局加速」（带数字，可能耗道具），不点
  screen: bed_dialog_free
  area: [273, 1024, 447, 1060]
  button: [190, 1010, 530, 1075]
MAIL_DIALOG:            # 「信件」弹窗标题
  screen: mail_dialog
  area: [320, 186, 400, 222]
MAIL_CLAIM_ALL:         # 「全部领取」。领完这个按钮消失，「删除已读」挪到中间，离这里只有 9 像素，必须认出按钮才点
  screen: mail_dialog
  area: [440, 1010, 560, 1056]
  button: [375, 1005, 630, 1062]
